name: CI / CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel any in-progress run on the same branch
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# ─────────────────────────────────────────────────────────────────────────────
# STAGE 1 — Quality Gate
# Runs lint, type-check, and unit tests in parallel sub-steps.
# The Production Build and Security Audit gates will NOT run if this fails.
# ─────────────────────────────────────────────────────────────────────────────
jobs:
  # ── 1a. Lint ────────────────────────────────────────────────────────────────
  lint:
    name: "🔍 Lint"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

  # ── 1b. Type check ──────────────────────────────────────────────────────────
  typecheck:
    name: "🔷 Type Check"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: TypeScript — no emit
        run: npm run typecheck

  # ── 1c. Unit tests + coverage ───────────────────────────────────────────────
  test:
    name: "🧪 Tests & Coverage"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests with coverage
        run: npm run test:coverage

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/
          if-no-files-found: ignore
          retention-days: 7

# ─────────────────────────────────────────────────────────────────────────────
# STAGE 2 — Production Build
# Only runs when ALL quality checks pass.
# ─────────────────────────────────────────────────────────────────────────────
  build:
    name: "📦 Production Build"
    runs-on: ubuntu-latest
    needs: [lint, typecheck, test]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build production bundle
        run: npm run build
        env:
          # Prevent build from failing on CI due to bundle-size warning
          # (611 kB JS is within acceptable range for a SPA — monitored below)
          CI: ""

      - name: Report bundle size
        run: |
          echo "### Bundle Size Report" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          du -sh dist/assets/* | sort -h >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Upload dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: taskflow-dist
          path: dist/
          if-no-files-found: error
          retention-days: 3

# ─────────────────────────────────────────────────────────────────────────────
# STAGE 3 — Security Audit
# Runs independently of the build so security issues are always visible.
# ─────────────────────────────────────────────────────────────────────────────
  security:
    name: "🛡️ Dependency Audit"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Audit level: critical only.
      #
      # KNOWN FALSE-POSITIVES (pure client-side SPA — RSC/SSR features unused):
      #   • GHSA-qwww-vcr4-c8h2  react-router RSC Mode CSRF  (7.12–8.2)
      #   • All react-router SSR/RSC XSS advisories
      # These advisories apply ONLY to React Server Components / SSR mode.
      # TaskFlow is a fully client-rendered SPA deployed to Cloudflare Workers
      # as static assets — no Node.js SSR server, no RSC, no server actions.
      # Tracked in: https://github.com/Karthik8402/taskflow/issues
      - name: Audit critical vulnerabilities
        run: npm audit --audit-level=critical

      - name: Full audit summary (informational)
        if: always()
        run: |
          echo "### npm audit summary" >> $GITHUB_STEP_SUMMARY
          npm audit --audit-level=info 2>&1 | tail -20 >> $GITHUB_STEP_SUMMARY || true
